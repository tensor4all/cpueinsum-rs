[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The tcontract 0.6.0 stack (tcontract-exec 0.6, strided-basic 0.8 on threadteam),
# from crates.io. tcontract-capi is unpublished (publish = false) and is taken from
# the tcontract-rs main commit that released tcontract 0.6.0.
tcontract = { version = "0.6.0" }
tcontract-exec = { version = "0.6.0" }
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "71a11a80", version = "0.1.0" }
# One strided release train: the registry resolves one version of each crate, so
# `StridedView` and `threadteam::Exec` stay single types across the graph.
strided-basic = { version = "0.8.0", default-features = false }
strided-view = "0.7.0"
threadteam = "0.1.0"
cpueinsum = { version = "0.6.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"

# tcontract-capi (private, not on crates.io) is a git dependency whose own path
# dependencies would otherwise be a second copy of tcontract, tcontract-exec and
# tcontract-kernel; point them at the published releases so each exists once.
[patch."https://github.com/tensor4all/tcontract-rs.git"]
tcontract = { version = "0.6.0" }
tcontract-exec = { version = "0.6.0" }
tcontract-kernel = { version = "0.3.0" }
