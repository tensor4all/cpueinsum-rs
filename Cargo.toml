[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# tcontract #73 adds a persistent wrapper for the host's selected shared Rayon pool
# atop #71/#72's caller-owned resources and safe prepared output boundary (the
# tprims-to-tcontract rename landed in tcontract-rs#108).
# strided 0.5.x and tcontract 0.2.3: the view metadata change reaches this
# crate's public API, so the pins move together. tcontract 0.2.4 takes
# strided-basic 0.5.4 and its strided crates
# from crates.io, so the strided pins here come from crates.io too (one
# StridedView type); strided-view stays =0.5.0 to match tlinalg 0.2.0.
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4b2b964005f6b668716edf7072e38ab564a7f204", version = "=0.2.4" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4b2b964005f6b668716edf7072e38ab564a7f204", version = "=0.2.4" }
strided-view = "=0.5.0"
strided-perm = "=0.5.0"
cpueinsum = { version = "=0.2.4", path = "crates/cpueinsum" }
# publish = false, so this is a git-only dependency, at the same revision as the
# tcontract pins above (the executor handle types must be one source).
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4b2b964005f6b668716edf7072e38ab564a7f204" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"
