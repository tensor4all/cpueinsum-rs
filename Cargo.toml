[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The tcontract 0.9.1 stack (tcontract-exec 0.9.1, t4a-faer 0.28, strided-basic 0.10,
# threadteam 0.3). tcontract and tcontract-exec stay on the same git rev as
# tcontract-capi: that crate is `publish = false`, so a registry tcontract would pull
# tcontract-exec from the registry while the capi pulls it from git, and the two
# copies make `Exec` two distinct types at the capi boundary.
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "5f2b54dc6d0e00c0f57aa8b325cfbe5e41011d65", version = "0.9.1" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "5f2b54dc6d0e00c0f57aa8b325cfbe5e41011d65", version = "0.9.1" }
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "5f2b54dc6d0e00c0f57aa8b325cfbe5e41011d65", version = "0.1.0" }
# One strided release train: the registry resolves one version of each crate, so
# `StridedView` and `threadteam::Exec` stay single types across the graph.
strided-basic = { version = "0.10.0", default-features = false }
strided-view = "0.7.0"
threadteam = "0.3.0"
cpueinsum = { version = "0.9.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"

