[workspace]
resolver = "2"
members = ["crates/cpueinsum", "crates/cpueinsum-blas"]

[workspace.package]
edition = "2021"
# tprims-contract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# tprims #72 includes merged #71's caller-owned resources and the safe prepared
# output boundary. strided #290 fixes terminal pointer arithmetic in its leaves.
# Keep both pins coordinated: tprims-contract's views are strided-view types.
tprims-contract = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "c893a7b3d54e16c4db3a190e2cf78d2575c24d65" }
tprims-exec = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "c893a7b3d54e16c4db3a190e2cf78d2575c24d65" }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "722dc6bece0c845ee612fa21242521c2e5ea83ac", version = "0.4.5" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "722dc6bece0c845ee612fa21242521c2e5ea83ac", version = "0.4.5" }
cpueinsum = { path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
