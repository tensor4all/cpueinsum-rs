[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The 0.3.0 chain: tcontract and its executor/capi crates share one batch lane
# policy (#123) and the allocation-free raw API (#121). As AGENTS.md requires,
# the tcontract crates stay git dependencies at the release revision (tcontract
# 0.3.1, tcontract-exec 0.3.0) so
# the executor handle types are one source across the stack; their strided deps
# come from crates.io.
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "7fef60d6408944511a6a623f922d582f4fbbc536", version = "=0.3.1" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "7fef60d6408944511a6a623f922d582f4fbbc536", version = "=0.3.0" }
# One strided release train (basic/view): cpueinsum-blas compiles
# `strided_basic::CopyPlan` for its packing; the view metadata must be one
# `StridedView` type across the stack.
strided-basic = { version = "=0.6.0", default-features = false }
strided-view = "=0.6.0"
cpueinsum = { version = "=0.3.1", path = "crates/cpueinsum" }
# publish = false: a git-only dependency at the same revision as above.
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "7fef60d6408944511a6a623f922d582f4fbbc536" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"
