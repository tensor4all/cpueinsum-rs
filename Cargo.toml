[workspace]
resolver = "2"
members = ["crates/cpueinsum", "crates/cpueinsum-blas"]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# tcontract #73 adds a persistent wrapper for the host's selected shared Rayon pool
# atop #71/#72's caller-owned resources and safe prepared output boundary (the
# tprims-to-tcontract rename landed in tcontract-rs#108).
# strided 0.5.0 and tcontract 0.2.0: the view metadata change reaches this
# crate's public API, so the pins move together.
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "26ed2a2a8c5eb9986b063dd2c91d43a88ddc208e", version = "=0.2.0" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "26ed2a2a8c5eb9986b063dd2c91d43a88ddc208e", version = "=0.2.0" }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "49dd63aac7af12a9a3e7de90cffb0337f26025c8", version = "=0.5.0" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "49dd63aac7af12a9a3e7de90cffb0337f26025c8", version = "=0.5.0" }
cpueinsum = { version = "=0.2.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
