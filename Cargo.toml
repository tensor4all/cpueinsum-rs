[workspace]
resolver = "2"
members = ["crates/cpueinsum", "crates/cpueinsum-blas"]

[workspace.package]
edition = "2021"
# tprims-contract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# tprims #73 adds a persistent wrapper for the host's selected shared Rayon pool
# atop #71/#72's caller-owned resources and safe prepared output boundary.
# Use published strided v0.4.6, retaining #290's safety fixes; keep tprims pins coherent.
tprims-contract = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "4bbc9109c5dbd9d570686bf0e3306cf9ab5f86ee" }
tprims-exec = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "4bbc9109c5dbd9d570686bf0e3306cf9ab5f86ee" }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "9fa651152d0b891b8f2f65a8f786a3058b3ed2e9", version = "=0.4.7" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "9fa651152d0b891b8f2f65a8f786a3058b3ed2e9", version = "=0.4.7" }
cpueinsum = { path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
