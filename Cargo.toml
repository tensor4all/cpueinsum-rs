[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The tcontract 0.6.0 stack (tcontract-exec 0.6, strided-basic 0.8 on threadteam),
# version-only. tcontract-capi is unpublished (publish = false) and is taken from
# the tcontract-rs main commit (PR #145, merged). None of these are on crates.io yet: the
# `[patch.crates-io]` block below resolves them to git.
tcontract = { version = "0.6.0" }
tcontract-exec = { version = "0.6.0" }
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4ea7f5cbb0347ab8689e112654466b596fdab9c3", version = "0.1.0" }
# One strided release train: the registry resolves one version of each crate, so
# `StridedView` and `threadteam::Exec` stay single types across the graph.
strided-basic = { version = "0.8.0", default-features = false }
strided-view = "0.7.0"
threadteam = "0.1.0"
cpueinsum = { version = "0.6.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"

# Unpublished upstreams: delete the entries once the crates are on crates.io. They are branch
# revs (threadteam-rs, strided-rs, tcontract-rs `feat/dispatch-cost`, faer `exp/par-team-lifetime`)
# that agree on one threadteam rev, so `Exec` and `TeamExec` are single types. t4a-faer is
# patched here because tcontract's own patch section does not reach its dependents.
# Each crate appears once in the graph: threadteam from threadteam-rs, the strided
# crates from strided-rs main, tcontract and tcontract-exec from tcontract-rs
# (the commit tcontract-capi pulls them from). Patches are not part of a published
# manifest, so the version requirements above are what downstream users resolve.
[patch.crates-io]
threadteam = { git = "https://github.com/tensor4all/threadteam-rs.git", rev = "5afe0b4d2ea604d0d8fe6b563bacf4c80f2d0bc4" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4ea7f5cbb0347ab8689e112654466b596fdab9c3" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4ea7f5cbb0347ab8689e112654466b596fdab9c3" }
t4a-faer = { git = "https://github.com/tensor4all/faer.git", rev = "9cd64f022a275071b64fbd0872e7c1f4d8d51bf9" }
t4a-faer-traits = { git = "https://github.com/tensor4all/faer.git", rev = "9cd64f022a275071b64fbd0872e7c1f4d8d51bf9" }
