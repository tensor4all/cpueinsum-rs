[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The tcontract 0.5.0 stack (strided-rs 0.7 `Exec` token, tcontract-exec 0.5).
# Temporary path dependencies on the sibling tcontract-rs checkout at 0.5.0;
# they become registry 0.5.0 once tcontract is published.
tcontract = { path = "../tcontract-rs-exec/crates/tcontract", version = "0.5.0" }
tcontract-exec = { path = "../tcontract-rs-exec/crates/tcontract-exec", version = "0.5.0" }
# tcontract-capi is still 0.1.0 in tcontract-rs and is not published.
tcontract-capi = { path = "../tcontract-rs-exec/crates/tcontract-capi", version = "0.1.0" }
# One strided release train (basic/view/exec): the registry resolves one 0.7.x
# version, so `StridedView` and `strided_exec::Exec` stay single types.
strided-basic = { version = "0.7.0", default-features = false }
strided-view = "0.7.0"
strided-exec = "0.7.0"
cpueinsum = { version = "0.5.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"
