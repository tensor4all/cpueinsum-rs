[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The tcontract 0.5.0 stack (strided-rs 0.7 `Exec` token, tcontract-exec 0.5),
# all from crates.io except tcontract-capi, which is unpublished (publish = false)
# and is taken from the tcontract-rs v0.5.0 release commit.
tcontract = { version = "0.5.0" }
tcontract-exec = { version = "0.5.0" }
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "33ee64621c646033fd6cea9244247b08877f6aed", version = "0.1.0" }
# One strided release train (basic/view/exec): the registry resolves one 0.7.x
# version, so `StridedView` and `strided_exec::Exec` stay single types.
strided-basic = { version = "0.7.0", default-features = false }
strided-view = "0.7.0"
strided-exec = "0.7.0"
cpueinsum = { version = "0.5.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"

# tcontract-capi is git-only, and its git manifest pulls tcontract and
# tcontract-exec from the same repository. Patching the registry names to that
# commit keeps one copy of each in the graph (the release tag v0.5.0). Patches
# are not part of a published manifest, so the crates.io requirements above are
# what downstream users resolve.
[patch.crates-io]
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "33ee64621c646033fd6cea9244247b08877f6aed" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "33ee64621c646033fd6cea9244247b08877f6aed" }
