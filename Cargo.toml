[workspace]
resolver = "2"
members = [
    "crates/cpueinsum",
    "crates/cpueinsum-bench",
    "crates/cpueinsum-blas",
    "crates/cpueinsum-capi",
]

[workspace.package]
edition = "2021"
# tcontract's MSRV (AVX-512 intrinsics in its packed driver).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/cpueinsum-rs"

[workspace.dependencies]
# The tcontract 0.9.0 stack (tcontract-exec 0.9, t4a-faer 0.27, strided-basic 0.9, threadteam 0.2),
# from crates.io, with tcontract's additive fresh-output publication API pinned
# below until its next release. The unpublished capi uses that same commit.
tcontract = { version = "0.9.0" }
tcontract-exec = { version = "0.9.0" }
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "625ed7a7124beb9537660b607c3c453d822d4dc8", version = "0.1.0" }
# One strided release train: the registry resolves one version of each crate, so
# `StridedView` and `threadteam::Exec` stay single types across the graph.
strided-basic = { version = "0.9.0", default-features = false }
strided-view = "0.7.0"
threadteam = "0.2.0"
cpueinsum = { version = "0.9.0", path = "crates/cpueinsum" }
# CBLAS declarations only; a provider is linked by the final binary
# (blas-src, or any crate that links a CBLAS library).
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
openblas-src = { version = "0.10", default-features = false }
num-complex = "0.4"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

# The packed driver's micro-kernels are tuned for this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[profile.bench]
inherits = "release"

# Temporary exact-commit integration of tensor4all/tcontract-rs#161. Keep capi
# on the same commit so both use one tcontract; switch back after its release.
[patch.crates-io]
tcontract = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "625ed7a7124beb9537660b607c3c453d822d4dc8" }

# Share the published executor with the git stack. Its kernel must stay at the
# same commit as tcontract because main includes unreleased kernel interfaces.
[patch."https://github.com/tensor4all/tcontract-rs.git"]
tcontract-exec = { version = "0.9.0" }
