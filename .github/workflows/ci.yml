name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, not on pull requests or pushes: see the macOS rows / `if:` below.
  schedule:
    - cron: "19 17 * * *"   # 17:19 UTC = 02:19 JST, daily; off the :00/:30 herd
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# This file is the gate AGENTS.md asks for, run on a clean machine: `cargo fmt`,
# `cargo clippy --workspace --all-targets`, `cargo test --profile ci --workspace`,
# `cargo test --release --workspace` and `cargo deny check bans`. Keep them in step.
#
# Every Rust job restores `Swatinem/rust-cache` and only a push to main writes it,
# so a pull request never publishes a cache built from PR-controlled content. Without
# it a cold `cargo test` of this workspace is over ten minutes on a four-core runner;
# measured on `tprims-rs`, whose `test` job is 13 minutes (ubuntu) and 17 minutes
# (macos) and sets the whole wall clock of its CI. macOS rows now run only on the daily schedule.
#
# The crate layout decides the matrix. `cpueinsum` builds with no C toolchain, but
# `cpueinsum-blas`'s tests link a provider: Accelerate on macOS, and on Linux the
# system OpenBLAS, which `openblas-src`'s `system` feature requires to be installed
# (hence the apt step - a bare runner fails with `unable to find library -lopenblas`).
# The release-profile tests run on Linux only: that profile exists for the packed
# driver's x86 kernels, and a thin-LTO build on a three-core macOS runner is by far
# the most expensive step available here.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Only threadteam (and vendor wrappers listed in deny.toml) may depend on
  # rayon: every other crate reaches parallelism through `threadteam::Exec`.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only threadteam (and vendor wrappers) depend on rayon
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  clippy:
    strategy:
      fail-fast: false
      matrix:
        # macOS rows exist only on the daily schedule and on manual dispatch (workflow_dispatch), not on pull
        # requests or pushes: macOS runners are the organization's most expensive Actions SKU (November 2026:
        # about $1,480 list price across tensor4all, 57% of Actions cost) and the Team plan allows five
        # concurrent macOS jobs across the organization.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS rows exist only on the daily schedule and on manual dispatch (workflow_dispatch), not on pull
        # requests or pushes: macOS runners are the organization's most expensive Actions SKU (November 2026:
        # about $1,480 list price across tensor4all, 57% of Actions cost) and the Team plan allows five
        # concurrent macOS jobs across the organization.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      # `cpueinsum-blas`'s dev-dependencies link the system OpenBLAS through
      # `openblas-src`'s `system` feature; macOS links Accelerate instead.
      - name: System BLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - run: cargo test --profile ci --workspace

  test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: System BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - run: cargo test --release --workspace

  # The allocation gates catch allocation regressions only. The overhead smoke
  # is a second, cheap layer (#23 comment): ratios measured in one run, never
  # absolute times, so a noisy runner cannot fail it spuriously. Small sizes,
  # release, single thread.
  overhead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: System BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - run: OVERHEAD_GATE=1 RAYON_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 cargo bench -p cpueinsum --bench overhead_smoke
      - run: OVERHEAD_GATE=1 RAYON_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 cargo bench -p cpueinsum-blas --bench overhead_smoke

  # The workspace declares `rust-version = "1.89"` (tprims-contract's MSRV, whose
  # packed driver uses AVX-512 intrinsics). Nothing else checks that claim, so it
  # would drift silently on the next dependency bump.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: System BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - run: cargo build --profile ci --workspace --all-targets

  # Only the scheduled run has macOS rows, so a failure there is the macOS signal PR CI no longer
  # gives. One rolling issue, found by title. Manual dispatches report in the run only.
  report:
    name: Report a failing night
    needs: [clippy, test]
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label=ci-nightly
          title="Scheduled macOS nightly is failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v body '%s\n\n%s\n' \
            "The scheduled CI run (the only one with macOS rows) failed in [run ${GITHUB_RUN_ID}](${run_url}) on \`${GITHUB_SHA:0:8}\`." \
            "PR CI no longer runs on macOS; dispatch \`ci.yml\` on a fix branch (\`workflow_dispatch\`) to verify it."
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "Scheduled macOS nightly" 2>/dev/null || true
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open \
            --search "in:title \"$title\"" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" --title "$title" --body "$body"
          fi
