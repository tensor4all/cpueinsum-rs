[package]
name = "cpueinsum-blas"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A CBLAS step backend for cpueinsum: binary steps on the linked BLAS"

[dependencies]
cblas-sys = { workspace = true }
strided-exec = { workspace = true }
cpueinsum = { workspace = true }
num-complex = { workspace = true }
strided-basic = { workspace = true }
strided-view = { workspace = true }
thiserror = { workspace = true }

# A provider for the tests and examples only: the library links none.
[target.'cfg(target_os = "macos")'.dev-dependencies]
blas-src = { workspace = true, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
blas-src = { workspace = true, features = ["openblas"] }
openblas-src = { workspace = true, features = ["cblas", "system"] }

[dev-dependencies]
strided-exec = { workspace = true, features = ["ledger"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
# Naming the typed execution refusal the N-ary route reports; the library itself
# depends on cpueinsum and the strided crates only.
tcontract-exec = { workspace = true }

[[bench]]
name = "overhead_smoke"
harness = false

[lints]
workspace = true
